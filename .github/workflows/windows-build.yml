name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Exclude from Windows Defender (Fix for mt.exe error)
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $retryCount = 0
          $success = $false
          while (-not $success -and $retryCount -lt 3) {
            Write-Host "Attempting build... ($($retryCount + 1)/3)"
            try {
              $process = Start-Process flutter -ArgumentList "build","windows","--release" -Wait -NoNewWindow -PassThru
              if ($process.ExitCode -eq 0) {
                $success = $true
                Write-Host "Build succeeded!"
              } else {
                throw "Build failed with exit code $($process.ExitCode)"
              }
            } catch {
              Write-Host "Build failed. Waiting 5 seconds before retrying..."
              Start-Sleep -Seconds 5
              $retryCount++
            }
          }
          if (-not $success) {
            Write-Error "Failed to build after 3 attempts."
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

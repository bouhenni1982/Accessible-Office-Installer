name: Build Windows EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "Windows build attempt $attempt/$attempts"
            flutter build windows --release -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $attempts) {
              Write-Host "Build failed. Cleaning Windows artifacts before retry."
              if (Test-Path "build/windows/x64") {
                Remove-Item "build/windows/x64" -Recurse -Force
              }
              Start-Sleep -Seconds 15
            }
          }

          throw "Windows build failed after $attempts attempts."

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
